# AntiGrifer Configuration

trust:
  # Время игры в минутах для достижения уровней доверия
  tier1_minutes: 60
  tier2_minutes: 120
  tier3_minutes: 240

  # Предметы, доступные с Уровня 1 (Огнеопасно)
  fire_materials:
    - FLINT_AND_STEEL
    - FIRE_CHARGE
    - LAVA_BUCKET

  # Предметы, доступные с Уровня 2 (Взрывоопасно)
  explosive_materials:
    - TNT
    - END_CRYSTAL
    - TNT_MINECART

  # Блоки, взаимодействие с которыми требует Уровня 3 (Редстоун)
  redstone_materials:
    - LEVER
    - STONE_BUTTON
    - OAK_BUTTON
    - SPRUCE_BUTTON
    - BIRCH_BUTTON
    - JUNGLE_BUTTON
    - ACACIA_BUTTON
    - DARK_OAK_BUTTON
    - MANGROVE_BUTTON
    - CHERRY_BUTTON
    - BAMBOO_BUTTON
    - CRIMSON_BUTTON
    - WARPED_BUTTON
    - STONE_PRESSURE_PLATE
    - OAK_PRESSURE_PLATE
    - SPRUCE_PRESSURE_PLATE
    - BIRCH_PRESSURE_PLATE
    - JUNGLE_PRESSURE_PLATE
    - ACACIA_PRESSURE_PLATE
    - DARK_OAK_PRESSURE_PLATE
    - MANGROVE_PRESSURE_PLATE
    - CHERRY_PRESSURE_PLATE
    - BAMBOO_PRESSURE_PLATE
    - CRIMSON_PRESSURE_PLATE
    - WARPED_PRESSURE_PLATE
    - LIGHT_WEIGHTED_PRESSURE_PLATE
    - HEAVY_WEIGHTED_PRESSURE_PLATE
    - DISPENSER
    - DROPPER
    - TNT

alerts:
  # Интервал повторных уведомлений если алерт не обработан (в секундах)
  repeat_interval_seconds: 60
  # Максимальное время хранения алерта без обработки (секунды, 0 = бесконечно)
  max_age_seconds: 0

messages:
  no_permission_fire: "&cУ вас недостаточно доверия для использования огнеопасных предметов! (Нужно 60 мин игры)"
  no_permission_explosive: "&cУ вас недостаточно доверия для использования взрывчатки! (Нужно 120 мин игры)"
  no_permission_redstone: "&cУ вас недостаточно доверия для взаимодействия с этими механизмами! (Нужно 240 мин игры)"
  no_permission_lava: "&cУ вас недостаточно доверия для размещения лавы! (Нужно 60 мин игры)"
  admin_alert: "&6[AntiGrifer] &eПодозрение на гриф: &f%player% &7(%reason%)"
  admin_tp_button: "&b[ТЕЛЕПОРТ]"
  admin_tp_hover: "&fНажмите, чтобы телепортироваться к %player%"
  admin_ack_button: "&a[✔ ПРИНЯТО]"
  trust_set: "&6[AntiGrifer] &eВаш уровень доверия изменён администратором: &f%tier%"

discord:
  # Включить Discord-интеграцию?
  enabled: false

  # Webhook URL из Настройки канала -> Интеграции -> Вебхуки
  webhook_url: ""

  # true  = используется Forum-канал (каждый гриф = отдельный тред, РЕКОМЕНДУЕТСЯ)
  # false = обычный текстовый канал (только embed, без тредов)
  forum_channel: true

  # Название сервера, отображается в embed-сообщениях
  server_name: "Мой Сервер"
