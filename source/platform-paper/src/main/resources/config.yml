  tier2_minutes: 120
  tier3_minutes: 240

  # Предметы, доступные с Уровня 1 (Огнеопасно)
  fire_materials:
    - FLINT_AND_STEEL
    - FIRE_CHARGE
    - LAVA_BUCKET

  # Предметы, доступные с Уровня 2 (Взрывоопасно)
