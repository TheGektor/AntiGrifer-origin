plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.5' apply false
    id 'xyz.jpenilla.run-paper' version '2.3.0' apply false
}

// Root project does NOT produce a JAR - only platform-paper does
jar.enabled = false

allprojects {
    group = 'ru.antigrief'
    version = '3.0.0-SNAPSHOT'

    repositories {
        mavenCentral()
        maven {
            name = "papermc-repo"
            url = "https://repo.papermc.io/repository/maven-public/"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/groups/public/"
        }
    }
}

subprojects {
    apply plugin: 'java'

    def targetJavaVersion = 21
    java {
        def javaVersion = JavaVersion.toVersion(targetJavaVersion)
        sourceCompatibility = javaVersion
        targetCompatibility = javaVersion
        if (JavaVersion.current() < javaVersion) {
            toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
            options.release.set(targetJavaVersion)
        }
    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:5.10.0')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    test {
        useJUnitPlatform()
    }
}

// Convenience task: copies the final plugin JAR to build/output/
tasks.register('copyPluginJar', Copy) {
    dependsOn ':platform-paper:shadowJar'
    from project(':platform-paper').tasks.named('shadowJar')
    into layout.buildDirectory.dir('output')
    println ">>> Plugin JAR path: build/output/AntiGriefSystem-${version}.jar"
}
