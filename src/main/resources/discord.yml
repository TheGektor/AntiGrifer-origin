    timestamp: true

  critical-location-alert:
    title: "🚨 ГРИФЕРСТВО ВАЖНОЙ ЗОНЫ! 🚨"
    description: "Попытка взаимодействия в критической локации **{location}**!\n\n👤 **Игрок:** `{player}`\n📍 **Координаты:** `{coords}`\n🔨 **Действие:** `{action}`"
