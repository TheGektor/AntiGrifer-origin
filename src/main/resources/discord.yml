messages:
  trust-given:
    title: "🛡️ Доверие выдано"
    description: "Администратор **{admin}** выдал статус доверенного игроку **{player}**.\nТеперь у него есть доступ к ограниченным предметам."
    color: "#2ECC71" # Emerald Green
    footer: "AntiGriefSystem • Log"
    timestamp: true
  
  trust-revoked:
    title: "🚫 Доверие снято"
    description: "Администратор **{admin}** лишил игрока **{player}** статуса доверенного.\nДоступ к ограниченным предметам закрыт."
    color: "#E74C3C" # Alizarin Red
    footer: "AntiGriefSystem • Log"
    timestamp: true

  promoted:
